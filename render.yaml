# Render 免费 PaaS 部署配置（Docker）
# 在 Render 新建 Web Service → Connect 本仓库 → 选 Docker → 上传/识别此文件
services:
  - type: web
    name: qiaoben-shuguo-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: AUTH_SECRET
        sync: false
      - key: DATA_FILE
        value: "/data/db.json"
    # 持久化：免费版无磁盘，数据会重置。要持久请开启 Render Disk 挂到 /data
    # disk:
    #   name: qiaoben-data
    #   mountPath: /data
    #   sizeGB: 1
