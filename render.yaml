# Render PaaS 部署配置（Docker）
# 在 Render 新建 Web Service → Connect 本仓库 → 选 Docker → 上传/识别此文件
# 注意：免费实例 (free) 不支持持久磁盘，需 starter 及以上才能挂载 disk
services:
  - type: web
    name: qiaoben-shuguo-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: HOST
        value: "0.0.0.0"
      - key: AUTH_SECRET
        sync: false
      - key: DATA_FILE
        value: "/data/db.json"
      - key: MEMBER_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERS
        value: "beau"
    # 持久化磁盘：Free 实例文件系统会重置，必须挂盘到 /data 才能保住数据
    disk:
      name: qiaoben-data
      mountPath: /data
      sizeGB: 1
